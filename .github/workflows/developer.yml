---
name: Developer image
on:
  push:
    branches:
      - main
jobs:
  push-proton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker - Login
        uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker - Build / Push (Proton)
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.proton
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.repository }}:dev
            ${{ github.repository }}:dev-proton

  push-wine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker - Login
        uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker - Build / Push (Wine)
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.wine
          platforms: linux/amd64
          push: true
          tags: '${{ github.repository }}:dev-wine'
