---
name: Release
on:
  release:
    types:
      - published
jobs:
  release-proton:
    name: Release - Proton Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker - Login
        uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker - Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}}-proton
            type=semver,pattern=v{{major}}.{{minor}}-proton
            type=semver,pattern=v{{major}}-proton
            type=raw,value=proton
          flavor: latest=true
      - name: Docker - Build / Push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.proton
          platforms: linux/amd64
          push: true
          tags: '${{ steps.meta.outputs.tags }}'

  release-wine:
    name: Release - Wine Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker - Login
        uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker - Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}-wine
            type=semver,pattern=v{{major}}.{{minor}}-wine
            type=semver,pattern=v{{major}}-wine
            type=raw,value=wine
          flavor: latest=false
      - name: Docker - Build / Push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.wine
          platforms: linux/amd64
          push: true
          tags: '${{ steps.meta.outputs.tags }}'
